services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend
    command: php-fpm
    volumes:
      - ./:/var/www/app_root
      - ./backend:/var/www/backend
      - backend-vendor:/var/www/backend/vendor
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: discounts
      DB_USERNAME: discounts
      DB_PASSWORD: discounts
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=180
    volumes:
      - ./:/var/www/app_root
      - ./backend:/var/www/backend
      - backend-vendor:/var/www/backend/vendor
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
      - redis
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
      - backend-vendor:/var/www/backend/vendor
    depends_on:
      - backend
      - redis
      - postgres

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && node .output/server/index.mjs"
    volumes:
      - ./frontend:/app
    environment:
      NUXT_PUBLIC_API_BASE: /api
      PORT: 3000
    depends_on:
      - nginx

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: discounts
      POSTGRES_USER: discounts
      POSTGRES_PASSWORD: discounts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  backend-vendor:
